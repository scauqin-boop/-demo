<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>成绩看板</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'PingFang HK','Microsoft YaHei',sans-serif; font-size:13px; color:#333; background:#f0f2f5; }
.topbar { position:fixed; top:0; left:0; right:0; height:48px; background:#00b389; display:flex; align-items:center; padding:0 16px; justify-content:space-between; z-index:100; }
.topbar-logo { color:#fff; font-size:15px; font-weight:700; }
.topbar-nav a { color:rgba(255,255,255,0.75); text-decoration:none; padding:4px 8px; border-radius:4px; font-size:12px; }
.topbar-nav a:hover { background:rgba(255,255,255,0.15); color:#fff; }
.topbar-nav { display:flex; gap:12px; }
.content { position:fixed; top:48px; left:0; right:0; bottom:0; overflow:hidden; display:flex; flex-direction:column; }
.page-header { background:#fff; padding:12px 16px; border-bottom:1px solid #e8e8e8; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.page-title { font-size:15px; font-weight:700; color:#222; }
.scroll-area { flex:1; overflow-y:auto; padding:14px 16px; }
.list-view { display:flex; flex-direction:column; flex:1; overflow:hidden; }
.detail-view { display:none; flex-direction:column; flex:1; overflow:hidden; }
.detail-view.open { display:flex; }
.list-view.hidden { display:none; }
.btn { display:inline-flex; align-items:center; gap:4px; padding:6px 14px; border-radius:4px; font-size:12px; cursor:pointer; border:1px solid transparent; white-space:nowrap; }
.btn-primary { background:#00b389; color:#fff; border-color:#00b389; }
.btn-primary:hover { background:#009e7a; }
.btn-default { background:#fff; color:#555; border-color:#d9d9d9; }
.btn-default:hover { border-color:#00b389; color:#00b389; }
.btn-sm { padding:3px 10px; font-size:11px; }
.form-control { border:1px solid #d9d9d9; border-radius:4px; padding:5px 8px; font-size:12px; outline:none; background:#fff; }
.badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:10px; font-weight:600; }
.badge-green { background:#f6ffed; color:#52c41a; border:1px solid #b7eb8f; }
.badge-red { background:#fff1f0; color:#ff4d4f; border:1px solid #ffa39e; }
.badge-orange { background:#fff7e6; color:#fa8c16; border:1px solid #ffd591; }
table { width:100%; border-collapse:collapse; }
thead tr { background:#fafafa; }
th { padding:9px 12px; text-align:left; font-size:12px; font-weight:600; color:#555; border-bottom:1px solid #f0f0f0; white-space:nowrap; }
td { padding:9px 12px; font-size:12px; color:#444; border-bottom:1px solid #f8f8f8; vertical-align:middle; }
.td-op { color:#00b389; cursor:pointer; font-size:11px; margin-right:8px; }
.td-op.warn { color:#fa8c16; }
.table-wrap { background:#fff; border-radius:6px; overflow:hidden; }
.toolbar { padding:10px 14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #f0f0f0; flex-wrap:wrap; background:#fff; }
.stat-card { background:#fff; border-radius:8px; padding:16px 20px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.stat-val { font-size:24px; font-weight:700; }
.stat-label { font-size:12px; color:#888; margin-top:4px; }
.toast-wrap { position:fixed; top:60px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast { background:#fff; border-radius:6px; box-shadow:0 4px 16px rgba(0,0,0,0.15); padding:10px 16px; font-size:12px; border-left:3px solid #00b389; min-width:200px; animation:fi 0.2s; }
@keyframes fi { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }
::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-thumb { background:#d9d9d9; border-radius:3px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">众安客服管理系统 — 成绩看板</div>
  <div class="topbar-nav">
    <a href="demo-admin-system.html">← 返回管理系统</a>
    <a href="demo-briefing.html">Briefing管理</a>
    <a href="demo-quiz-bank.html">题库管理</a>
    <a href="demo-quiz-paper.html">试卷管理</a>
  </div>
</div>

<div class="content">
  <!-- 汇总视图 -->
  <div class="list-view" id="listView">
    <div class="page-header" style="flex-direction:column;align-items:stretch;gap:8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="page-title">成绩看板</div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:12px;color:#666;">派发时间：</span>
        <input class="form-control" type="date" id="dispDateStart" style="width:140px;" onchange="onDispDateChange()">
        <span style="font-size:12px;color:#aaa;">至</span>
        <input class="form-control" type="date" id="dispDateEnd" style="width:140px;" onchange="onDispDateChange()">
        <button class="btn btn-default btn-sm" onclick="resetDispDate()" style="font-size:10px;padding:2px 8px;">重置</button>
        <span style="width:1px;height:20px;background:#e8e8e8;"></span>
        <span style="font-size:12px;color:#666;">试卷：</span>
        <select class="form-control" style="width:220px;" id="paperSelect" onchange="onPaperChange(this.value)">
          <option value="">请选择试卷</option>
          <option value="1">2026-07-02 Briefing小测</option>
          <option value="2">2026年7月月测</option>
          <option value="3">开户业务专项考核</option>
        </select>
        <span style="font-size:12px;color:#666;margin-left:8px;">派发批次：</span>
        <select class="form-control" style="width:260px;" id="batchSelect" onchange="onBatchChange(this.value)" disabled>
          <option value="">请先选择试卷</option>
        </select>
      </div>
      <!-- 批次信息标签 -->
      <div id="batchInfoBar" style="display:none;background:#e6f7ff;border:1px solid #91d5ff;border-radius:4px;padding:6px 12px;font-size:12px;color:#1890ff;display:none;align-items:center;gap:6px;">
        <span style="font-weight:600;">当前查看批次：</span>
        <span id="batchInfoText"></span>
      </div>
    </div>
    <div class="scroll-area" id="scoreBody"></div>
  </div>

  <!-- 个人详情视图 -->
  <div class="detail-view" id="detailView">
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="color:#00b389;cursor:pointer;font-size:12px;" onclick="goBack()">◀ 返回看板</span>
        <span style="color:#ddd;">|</span>
        <div class="page-title" id="detailTitle">答题详情</div>
      </div>
    </div>
    <div class="scroll-area" id="detailBody"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
var scorePersons = [
  { name:'覃国权', dept:'客服事业部', status:'done', attempts:[
      {score:92, time:'2026-07-02 10:15', duration:'8分钟', type:'首考',
        answers:[
          {q:'MCV开户新增的视频验证步骤…',myAns:'B. 人脸识别之后',correct:true,rightAns:'B'},
          {q:'以下哪些情况会导致视频验证失败…',myAns:'A、B',correct:false,rightAns:'A、B、D'},
          {q:'本次转账规则调整主要影响哪类转账…',myAns:'B. 港元转人民币跨境转账',correct:true,rightAns:'B'}
        ]},
      {score:85, time:'2026-07-04 09:30', duration:'12分钟', type:'第1次重做',
        answers:[
          {q:'MCV开户新增的视频验证步骤…',myAns:'A. 填写个人资料之后',correct:false,rightAns:'B'},
          {q:'以下哪些情况会导致视频验证失败…',myAns:'A、B、D',correct:true,rightAns:'A、B、D'},
          {q:'本次转账规则调整主要影响哪类转账…',myAns:'B. 港元转人民币跨境转账',correct:true,rightAns:'B'}
        ]},
      {score:96, time:'2026-07-06 14:20', duration:'6分钟', type:'第2次重做',
        answers:[
          {q:'MCV开户新增的视频验证步骤…',myAns:'B. 人脸识别之后',correct:true,rightAns:'B'},
          {q:'以下哪些情况会导致视频验证失败…',myAns:'A、B、D',correct:true,rightAns:'A、B、D'},
          {q:'本次转账规则调整主要影响哪类转账…',myAns:'B. 港元转人民币跨境转账',correct:true,rightAns:'B'}
        ]}
    ]
  },
  { name:'Lucy', dept:'客服事业部', status:'done', attempts:[{score:85, time:'2026-07-02 10:32', duration:'11分钟', type:'首考', answers:[]}] },
  { name:'Tom', dept:'运营部', status:'done', attempts:[{score:78, time:'2026-07-02 11:05', duration:'14分钟', type:'首考', answers:[]}] },
  { name:'Ines', dept:'客服事业部', status:'done', attempts:[{score:100, time:'2026-07-02 09:58', duration:'7分钟', type:'首考', answers:[]}] },
  { name:'Amy', dept:'运营部', status:'done', attempts:[{score:55, time:'2026-07-02 14:22', duration:'18分钟', type:'首考', answers:[]}] },
  { name:'Kevin', dept:'客服事业部', status:'done', attempts:[{score:72, time:'2026-07-02 15:10', duration:'12分钟', type:'首考', answers:[]}] },
  { name:'Sam', dept:'运营部', status:'pending', attempts:[] },
  { name:'Chloe', dept:'客服事业部', status:'pending', attempts:[] },
  { name:'Brian', dept:'运营部', status:'pending', attempts:[] },
  { name:'May', dept:'客服事业部', status:'done', attempts:[{score:88, time:'2026-07-02 16:40', duration:'9分钟', type:'首考', answers:[]}] }
];

function renderScore() {
  var done = scorePersons.filter(function(p){return p.status==='done';});
  var scores = done.map(function(p){return p.attempts[p.attempts.length-1].score;});
  var avg = scores.length?(scores.reduce(function(a,b){return a+b;},0)/scores.length).toFixed(1):0;
  var passCount = scores.filter(function(s){return s>=60;}).length;
  var total = scorePersons.length;

  var cards = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">'
    +'<div class="stat-card"><div class="stat-val" style="color:#00b389;">'+total+' 人</div><div class="stat-label">派发人数</div></div>'
    +'<div class="stat-card"><div class="stat-val" style="color:#1890ff;">'+done.length+' / '+total+'</div><div class="stat-label">已完成</div></div>'
    +'<div class="stat-card"><div class="stat-val" style="color:#fa8c16;">'+avg+' 分</div><div class="stat-label">平均分</div></div>'
    +'<div class="stat-card"><div class="stat-val" style="color:#52c41a;">'+(done.length?Math.round(passCount/done.length*100):0)+'%</div><div class="stat-label">通过率</div></div>'
    +'</div>';

  var tableRows = scorePersons.map(function(p) {
    var latest = p.attempts.length>0 ? p.attempts[p.attempts.length-1] : null;
    var stBadge = p.status==='done'?'<span class="badge badge-green">已完成</span>':'<span class="badge badge-red">未完成</span>';
    var scoreDisplay = latest?'<span style="font-weight:700;color:'+(latest.score>=60?'#52c41a':'#ff4d4f')+';">'+latest.score+'</span>':'<span style="color:#ccc;">—</span>';
    var examCount = p.attempts.length > 0 ? p.attempts.length : '—';
    var timeDisplay = latest?latest.time:'—';
    var durDisplay = latest?latest.duration:'—';
    var ops = p.status==='done'
      ?'<span class="td-op" onclick="openPersonDetail(\''+p.name+'\')">答题详情</span>'
      :'<span class="td-op warn" onclick="showToast(\'已向 '+p.name+' 发送催促通知\')">催促</span>';
    return '<tr>'
      +'<td>'+p.name+'</td>'
      +'<td>'+p.dept+'</td>'
      +'<td>'+stBadge+'</td>'
      +'<td>'+scoreDisplay+'</td>'
      +'<td style="text-align:center;">'+examCount+'</td>'
      +'<td style="color:#aaa;">'+timeDisplay+'</td>'
      +'<td style="color:#aaa;">'+durDisplay+'</td>'
      +'<td>'+ops+'</td>'
      +'</tr>';
  }).join('');

  document.getElementById('scoreBody').innerHTML = cards
    +'<div class="table-wrap">'
    +'<div class="toolbar">'
    +'<select class="form-control" style="width:120px;"><option>全部状态</option><option>已完成</option><option>未完成</option></select>'
    +'<select class="form-control" style="width:120px;"><option>全部部门</option><option>客服事业部</option><option>运营部</option></select>'
    +'<button class="btn btn-default btn-sm" style="margin-left:auto;" onclick="showToast(\'正在导出...\')">📥 导出Excel</button>'
    +'<button class="btn btn-default btn-sm" style="color:#fa8c16;border-color:#ffd591;" onclick="remindAll()">🔔 提醒未完成人员</button>'
    +'</div>'
    +'<table><thead><tr><th>姓名</th><th>部门</th><th>状态</th><th>得分</th><th>考试次数</th><th>提交时间</th><th>用时</th><th>操作</th></tr></thead>'
    +'<tbody>'+tableRows+'</tbody></table>'
    +'<div style="padding:10px 14px;font-size:11px;color:#aaa;text-align:right;">共 '+total+' 人</div>'
    +'</div>';
}

function remindAll() {
  var pending = scorePersons.filter(function(p){return p.status==='pending';});
  showToast('已向 '+pending.length+' 位未完成人员发送提醒');
}

var batchData = {
  '1': [
    {id:'b1', label:'#1 (2026-07-02 08:30)', time:'2026-07-02 08:30', start:'2026-07-02 09:00', end:'2026-07-03 23:59', status:'ended'},
    {id:'b2', label:'#2 (2026-07-04 08:00)', time:'2026-07-04 08:00', start:'2026-07-04 09:00', end:'2026-07-05 23:59', status:'active'}
  ],
  '2': [
    {id:'b3', label:'#1 (2026-07-01 08:15)', time:'2026-07-01 08:15', start:'2026-07-01 09:00', end:'2026-07-31 23:59', status:'active'}
  ],
  '3': []
};
var currentPaperId = '1';
var currentBatchId = '';

function onPaperChange(val) {
  currentPaperId = val;
  currentBatchId = '';
  updateBatchSelect();
  updateBatchInfoBar();
  if (!val) {
    document.getElementById('scoreBody').innerHTML = '<div style="text-align:center;color:#ccc;padding:60px 20px;font-size:13px;">请先选择试卷，再选择派发批次以查看成绩</div>';
    return;
  }
  var batches = batchData[currentPaperId] || [];
  if (batches.length === 0) {
    document.getElementById('scoreBody').innerHTML = '<div style="text-align:center;color:#ccc;padding:60px 20px;font-size:13px;">该试卷暂无派发记录</div>';
    return;
  }
  document.getElementById('scoreBody').innerHTML = '<div style="text-align:center;color:#ccc;padding:60px 20px;font-size:13px;">请选择派发批次以查看成绩详情</div>';
}

function onBatchChange(val) {
  currentBatchId = val;
  updateBatchInfoBar();
  if (val) {
    renderScore();
  } else {
    document.getElementById('scoreBody').innerHTML = '<div style="text-align:center;color:#ccc;padding:60px 20px;font-size:13px;">请选择派发批次以查看成绩详情</div>';
  }
}

function onDispDateChange() {
  var ds = document.getElementById('dispDateStart').value;
  var de = document.getElementById('dispDateEnd').value;
  currentPaperId = '';
  currentBatchId = '';
  var paperSel = document.getElementById('paperSelect');
  paperSel.value = '';
  updateBatchSelect();
  updateBatchInfoBar();
  document.getElementById('scoreBody').innerHTML = '<div style="text-align:center;color:#ccc;padding:60px 20px;font-size:13px;">请选择试卷和派发批次以查看成绩</div>';
  filterPapersByDate(ds, de);
}

function resetDispDate() {
  document.getElementById('dispDateStart').value = '';
  document.getElementById('dispDateEnd').value = '';
  var paperSel = document.getElementById('paperSelect');
  paperSel.innerHTML = '<option value="">请选择试卷</option>'
    + '<option value="1">2026-07-02 Briefing小测</option>'
    + '<option value="2">2026年7月月测</option>'
    + '<option value="3">开户业务专项考核</option>';
  currentPaperId = '';
  currentBatchId = '';
  paperSel.value = '';
  updateBatchSelect();
  updateBatchInfoBar();
  document.getElementById('scoreBody').innerHTML = '<div style="text-align:center;color:#ccc;padding:60px 20px;font-size:13px;">请选择试卷和派发批次以查看成绩</div>';
}

var paperDispatchDates = {
  '1': '2026-07-02',
  '2': '2026-07-01',
  '3': ''
};

function filterPapersByDate(ds, de) {
  if (!ds && !de) {
    resetDispDate();
    return;
  }
  var paperSel = document.getElementById('paperSelect');
  var allPapers = [
    {val:'1', label:'2026-07-02 Briefing小测'},
    {val:'2', label:'2026年7月月测'},
    {val:'3', label:'开户业务专项考核'}
  ];
  var html = '<option value="">请选择试卷</option>';
  allPapers.forEach(function(p) {
    var pd = paperDispatchDates[p.val];
    if (!pd) return;
    var inRange = true;
    if (ds && pd < ds) inRange = false;
    if (de && pd > de) inRange = false;
    if (inRange) html += '<option value="'+p.val+'">'+p.label+'</option>';
  });
  paperSel.innerHTML = html;
}

function updateBatchSelect() {
  var sel = document.getElementById('batchSelect');
  if (!currentPaperId) {
    sel.innerHTML = '<option value="">请先选择试卷</option>';
    sel.disabled = true;
    return;
  }
  var batches = batchData[currentPaperId] || [];
  if (batches.length === 0) {
    sel.innerHTML = '<option value="">暂无派发批次</option>';
    sel.disabled = true;
    return;
  }
  var ds = document.getElementById('dispDateStart').value;
  var de = document.getElementById('dispDateEnd').value;
  var filtered = batches.filter(function(b) {
    var bd = b.time.substring(0, 10);
    if (ds && bd < ds) return false;
    if (de && bd > de) return false;
    return true;
  });
  if (filtered.length === 0) {
    sel.innerHTML = '<option value="">该时间段无派发批次</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = '<option value="">请选择派发批次</option>'
    + filtered.map(function(b) {
        var stLabel = b.status==='ended'?'已截止':'进行中';
        return '<option value="'+b.id+'">'+b.label+' ('+stLabel+')</option>';
      }).join('');
}

function updateBatchInfoBar() {
  var bar = document.getElementById('batchInfoBar');
  var text = document.getElementById('batchInfoText');
  if (!currentBatchId) {
    bar.style.display = 'none';
    return;
  }
  var batches = batchData[currentPaperId] || [];
  var b = batches.find(function(x){return x.id===currentBatchId;});
  if (!b) { bar.style.display='none'; return; }
  var stLabel = b.status==='ended'?'已截止':'进行中';
  var stColor = b.status==='ended'?'color:#aaa;':'color:#52c41a;';
  text.innerHTML = b.label+' <span style="'+stColor+'font-weight:600;">('+stLabel+')</span>';
  bar.style.display = 'flex';
}

var currentDetailPerson = null;
var currentAttemptIdx = 0;

function openPersonDetail(name) {
  var p = scorePersons.find(function(x){return x.name===name;});
  if (!p || p.attempts.length===0) return;
  currentDetailPerson = p;
  currentAttemptIdx = p.attempts.length - 1;
  document.getElementById('detailTitle').textContent = p.name+' — 答题详情';
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.add('open');
  renderPersonDetail();
}

function onAttemptChange(idx) {
  currentAttemptIdx = parseInt(idx);
  renderPersonDetail();
}

function renderPersonDetail() {
  var p = currentDetailPerson;
  if (!p) return;
  var att = p.attempts[currentAttemptIdx];

  // 作答批次下拉（按时间倒序）
  var attemptOpts = '';
  for (var i = p.attempts.length - 1; i >= 0; i--) {
    var a = p.attempts[i];
    var sel = i === currentAttemptIdx ? 'selected' : '';
    attemptOpts += '<option value="'+i+'" '+sel+'>'+a.time+' '+a.type+' '+a.score+' 分</option>';
  }

  var infoHtml = '<div style="display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #f0f0f0;margin-bottom:16px;font-size:12px;flex-wrap:wrap;">'
    +'<span>姓名：<strong>'+p.name+'</strong></span>'
    +'<span style="color:#ddd;">|</span>'
    +'<span>部门：'+p.dept+'</span>'
    +'<span style="color:#ddd;">|</span>'
    +'<span style="display:flex;align-items:center;gap:4px;">当前作答批次：<select class="form-control" style="width:auto;min-width:240px;" onchange="onAttemptChange(this.value)">'+attemptOpts+'</select></span>'
    +'<span style="color:#ddd;">|</span>'
    +'<span>得分：<strong style="color:'+(att.score>=60?'#52c41a':'#ff4d4f')+';">'+att.score+' 分</strong></span>'
    +'<span style="color:#ddd;">|</span>'
    +'<span>提交：'+att.time+'</span>'
    +'<span style="color:#ddd;">|</span>'
    +'<span>用时：'+att.duration+'</span>'
    +'</div>';

  var ansHtml = (att.answers && att.answers.length>0)
    ? att.answers.map(function(a, i) {
        return '<div style="border:1px solid '+(a.correct?'#b7eb8f':'#ffa39e')+';border-radius:6px;padding:12px;margin-bottom:8px;background:'+(a.correct?'#f6ffed':'#fff1f0')+'">'
          +'<div style="font-size:11px;font-weight:600;color:'+(a.correct?'#52c41a':'#ff4d4f')+';margin-bottom:4px;">'+(a.correct?'✅ 答对':'❌ 答错')+'</div>'
          +'<div style="font-size:12px;font-weight:600;color:#222;margin-bottom:4px;">'+(i+1)+'. '+a.q+'</div>'
          +'<div style="font-size:12px;color:#666;">我的答案：<span style="color:'+(a.correct?'#52c41a':'#ff4d4f')+';">'+a.myAns+'</span></div>'
          +(!a.correct?'<div style="font-size:12px;color:#666;margin-top:2px;">正确答案：<span style="color:#52c41a;font-weight:600;">'+a.rightAns+'</span></div>':'')
          +'</div>';
      }).join('')
    : '<div style="text-align:center;color:#aaa;padding:20px;font-size:12px;">暂无详细答题记录</div>';

  document.getElementById('detailBody').innerHTML = '<div style="background:#fff;border-radius:6px;padding:16px 20px;">'
    +infoHtml
    +'<div style="font-size:13px;font-weight:600;color:#222;margin-bottom:10px;">📝 逐题答题情况</div>'
    +ansHtml+'</div>';
}

function goBack() {
  document.getElementById('detailView').classList.remove('open');
  document.getElementById('listView').classList.remove('hidden');
}

function showToast(msg) {
  var w=document.getElementById('toastWrap'); var t=document.createElement('div');
  t.className='toast'; t.textContent='✅ '+msg; w.appendChild(t);
  setTimeout(function(){ if(t.parentNode)t.parentNode.removeChild(t); }, 2000);
}

updateBatchSelect();
document.getElementById('scoreBody').innerHTML = '<div style="text-align:center;color:#ccc;padding:60px 20px;font-size:13px;">请选择试卷和派发批次以查看成绩</div>';

function initFromReferrer() {
  var params = new URLSearchParams(window.location.search);
  var pid = params.get('paper');
  var bid = params.get('batch');
  if (pid) {
    currentPaperId = pid;
    document.getElementById('paperSelect').value = pid;
    updateBatchSelect();
    if (bid) {
      currentBatchId = bid;
      document.getElementById('batchSelect').value = bid;
      updateBatchInfoBar();
      renderScore();
    } else {
      var batches = batchData[pid] || [];
      if (batches.length === 1) {
        currentBatchId = batches[0].id;
        document.getElementById('batchSelect').value = batches[0].id;
        updateBatchInfoBar();
        renderScore();
      }
    }
  }
}
initFromReferrer();
</script>
</body>
</html>
