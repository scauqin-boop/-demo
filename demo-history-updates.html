<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史更新 — ARK 知识库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang HK', 'Microsoft YaHei', sans-serif; font-size: 13px; background: #f0f2f5; color: #333; }

  /* ── TOP BAR ── */
  .topbar { background: #00b389; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 16px; }
  .topbar .logo { color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  .topbar .tabs { display: flex; gap: 4px; flex: 1; }
  .topbar .tab { background: rgba(255,255,255,0.15); color: #fff; padding: 6px 14px; border-radius: 4px 4px 0 0; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .topbar .tab.active { background: #fff; color: #00b389; font-weight: 600; }
  .topbar .tab .close { opacity: 0.6; font-size: 10px; }
  .topbar .nav-icons { display: flex; gap: 12px; align-items: center; color: #fff; font-size: 12px; }
  .topbar .nav-icons span { cursor: pointer; display: flex; align-items: center; gap: 4px; }

  /* ── LAYOUT ── */
  .container { height: calc(100vh - 48px); display: flex; flex-direction: column; background: #fff; }

  /* ── SUB TAB BAR (消息中心 内部分类) ── */
  .subtabs { display: flex; align-items: center; gap: 2px; padding: 0 16px; border-bottom: 1px solid #f0f0f0; background: #fff; overflow-x: auto; flex-shrink: 0; }
  .subtab { padding: 12px 14px; font-size: 13px; color: #666; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .subtab:hover { color: #00b389; }
  .subtab.active { color: #00b389; font-weight: 600; border-bottom-color: #00b389; }

  /* ── FILTER ROW ── */
  .filter-row { display: flex; align-items: center; gap: 20px; padding: 14px 16px; border-bottom: 1px solid #f0f0f0; background: #fff; flex-shrink: 0; flex-wrap: wrap; }
  .filter-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555; }
  .filter-item .required { color: #f5222d; margin-right: 2px; }
  .date-range { display: flex; align-items: center; gap: 6px; }
  .date-input { border: 1px solid #d9d9d9; border-radius: 4px; padding: 5px 10px; font-size: 12px; color: #333; outline: none; background: #fff; cursor: pointer; width: 118px; }
  .date-input:focus { border-color: #00b389; }
  .date-sep { color: #bbb; }
  .filter-select { border: 1px solid #d9d9d9; border-radius: 4px; padding: 5px 24px 5px 10px; font-size: 12px; color: #333; outline: none; background: #fff; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23999'/></svg>"); background-repeat: no-repeat; background-position: right 8px center; }
  .filter-select:focus { border-color: #00b389; }
  .filter-btn { padding: 5px 16px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; color: #666; transition: all 0.15s; }
  .filter-btn.primary { background: #00b389; border-color: #00b389; color: #fff; font-weight: 600; }
  .filter-btn.primary:hover { background: #009e7a; }
  .filter-btn:not(.primary):hover { border-color: #00b389; color: #00b389; }

  /* ── CONTENT AREA ── */
  .history-area { flex: 1; overflow-y: auto; padding: 4px 16px 24px; }

  .date-group { margin-top: 18px; }
  .date-group-header { display: flex; align-items: center; gap: 10px; padding: 6px 0; position: sticky; top: 0; background: #fff; z-index: 2; }
  .date-group-title { font-size: 13px; font-weight: 700; color: #222; }
  .date-group-title .today-flag { font-size: 10px; font-weight: 600; color: #00b389; background: #e6faf5; border: 1px solid #b7e8d8; border-radius: 10px; padding: 1px 7px; margin-left: 6px; }
  .date-group-count { font-size: 11px; color: #999; }
  .date-group-line { flex: 1; height: 1px; background: #f0f0f0; }

  .hist-item { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: #fff; border: 1px solid #f0f0f0; border-radius: 6px; margin-top: 8px; cursor: pointer; transition: all 0.15s; }
  .hist-item:hover { border-color: #b7e8d8; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .hist-unread-dot { position: absolute; top: 14px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: #f5222d; }
  .hist-item.read .hist-unread-dot { display: none; }
  .hist-icon { width: 30px; height: 30px; border-radius: 6px; background: #f0faf7; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .hist-main { flex: 1; min-width: 0; }
  .hist-top-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .d-type { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; flex-shrink: 0; }
  .d-type.new { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
  .d-type.update { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
  .hist-title { font-size: 12px; font-weight: 600; color: #333; line-height: 1.4; }
  .hist-path { font-size: 11px; color: #aaa; margin-bottom: 2px; }
  .hist-time { font-size: 10px; color: #ccc; }

  /* empty state */
  .empty-state { text-align: center; padding: 60px 20px; color: #bbb; }
  .empty-state .e-icon { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">zabank</div>
  <div class="tabs">
    <div class="tab">📋 BBC业务</div>
    <div class="tab active">📚 消息中心 <span class="close">✕</span></div>
  </div>
  <div class="nav-icons">
    <span>🎯 当日指标</span>
    <span>🖥 服务台 <span style="background:#f5222d;color:#fff;border-radius:10px;padding:1px 5px;font-size:10px;">5</span></span>
    <span>📚 知识库</span>
    <span>👤 覃国权 ▾</span>
  </div>
</div>

<div class="container">

  <!-- Sub Tabs -->
  <div class="subtabs">
    <div class="subtab">知识学习</div>
    <div class="subtab">活动工厂</div>
    <div class="subtab">工单任务(4497)</div>
    <div class="subtab">回访任务</div>
    <div class="subtab">质检结果</div>
    <div class="subtab">全站消息(5)</div>
    <div class="subtab">警察邮件(7)</div>
    <div class="subtab">旅运邮箱</div>
    <div class="subtab">Dispute外呼</div>
    <div class="subtab active" id="historyTab">历史更新</div>
  </div>

  <!-- Filter Row -->
  <div class="filter-row">
    <div class="filter-item">
      <span><span class="required">*</span>消息发送时间：</span>
      <div class="date-range">
        <input type="date" class="date-input" id="dateFrom">
        <span class="date-sep">~</span>
        <input type="date" class="date-input" id="dateTo">
      </div>
    </div>
    <div class="filter-item">
      <span>更新类型：</span>
      <select class="filter-select" id="typeFilter">
        <option value="all">全部</option>
        <option value="new">新增</option>
        <option value="update">修改</option>
      </select>
    </div>
    <div class="filter-item">
      <span>阅读状态：</span>
      <select class="filter-select" id="readFilter">
        <option value="all">全部</option>
        <option value="unread">未读</option>
        <option value="read">已读</option>
      </select>
    </div>
    <div class="filter-item" style="gap:8px;">
      <button class="filter-btn primary" onclick="applyFilter()">查 询</button>
      <button class="filter-btn" onclick="resetFilter()">重 置</button>
    </div>
  </div>

  <!-- Content -->
  <div class="history-area" id="historyArea"></div>

</div>

<script>
  // ─── MOCK DATA：上线后累计的每日更新记录（按日期降序） ───
  var TODAY = '2026-07-02';

  var historyData = [
    {
      date: '2026-07-02',
      items: [
        { type:'new', label:'新增', title:'开户MCV申请流程最新说明', path:'个人银行 › 开户业务 › 开户介绍', time:'09:32', author:'Lucy', read:false, kind:'knowledge' },
        { type:'update', label:'修改', title:'转账手续费收费标准（2026年7月版）', path:'个人银行 › 转账业务 › 转账收费', time:'11:15', author:'Tom', read:false, kind:'knowledge' },
        { type:'new', label:'新增', title:'VA账户开设常见拒绝原因整理', path:'VA相關查詢 › 开户 › 开户被拒', time:'14:48', author:'Ines', read:false, kind:'knowledge' }
      ]
    },
    {
      date: '2026-07-01',
      items: [
        { type:'update', label:'修改', title:'VA账户新功能常见问题汇总', path:'VA相關查詢 › 账户功能 › 新功能说明', time:'10:05', author:'Tom', read:true, kind:'knowledge' }
      ]
    },
    {
      date: '2026-06-30',
      items: [
        { type:'new', label:'新增', title:'基金申购常见拒绝原因整理', path:'个人银行 › 基金业务 › 申购问题', time:'09:48', author:'Lucy', read:true, kind:'knowledge' },
        { type:'update', label:'修改', title:'基金赎回到账时间说明（2026年6月版）', path:'个人银行 › 基金业务 › 赎回规则', time:'13:22', author:'Ines', read:true, kind:'knowledge' }
      ]
    },
    {
      date: '2026-06-29',
      items: [
        { type:'update', label:'修改', title:'跨境汇款限额说明（2026年6月版）', path:'个人银行 › 转账业务 › 跨境汇款', time:'15:40', author:'Tom', read:true, kind:'knowledge' }
      ]
    }
  ];

  function formatDate(d) {
    var parts = d.split('-');
    return parts[0] + '/' + parts[1] + '/' + parts[2];
  }

  function renderHistory(fromStr, toStr, typeVal, readVal) {
    var area = document.getElementById('historyArea');
    var from = fromStr ? new Date(fromStr) : null;
    var to = toStr ? new Date(toStr) : null;

    var groups = historyData.filter(function(g){
      var gd = new Date(g.date);
      if (from && gd < from) return false;
      if (to && gd > to) return false;
      return true;
    }).map(function(g){
      var items = g.items.filter(function(it, originalIdx){
        if (typeVal !== 'all' && it.type !== typeVal) return false;
        if (readVal === 'unread' && it.read) return false;
        if (readVal === 'read' && !it.read) return false;
        it._originalIdx = originalIdx;
        return true;
      });
      return { date: g.date, items: items };
    }).filter(function(g){ return g.items.length > 0; });

    if (!groups.length) {
      area.innerHTML = '<div class="empty-state"><div class="e-icon">📭</div><p>暂无数据</p></div>';
      return;
    }

    area.innerHTML = groups.map(function(g){
      var isToday = g.date === TODAY;
      var itemsHtml = g.items.map(function(it){
        var readClass = it.read ? ' read' : '';
        return '<div class="hist-item' + readClass + '" onclick="handleHistoryClick(this,\'' + g.date + '\',' + it._originalIdx + ')">'
          + '<span class="hist-unread-dot"></span>'
          + '<div class="hist-icon">📋</div>'
          + '<div class="hist-main">'
          + '<div class="hist-top-row"><span class="d-type ' + it.type + '">' + it.label + '</span></div>'
          + '<div class="hist-title">' + it.title + '</div>'
          + '<div class="hist-path">' + it.path + '</div>'
          + '<div class="hist-time">' + formatDate(g.date) + ' ' + it.time + ' · 更新人：' + it.author + '</div>'
          + '</div>'
          + '</div>';
      }).join('');

      return '<div class="date-group">'
        + '<div class="date-group-header">'
        + '<span class="date-group-title">' + formatDate(g.date) + (isToday ? '<span class="today-flag">今日</span>' : '') + '</span>'
        + '<span class="date-group-count">共 ' + g.items.length + ' 条更新</span>'
        + '<span class="date-group-line"></span>'
        + '</div>'
        + itemsHtml
        + '</div>';
    }).join('');
  }

  function handleHistoryClick(el, date, originalIdx) {
    var group = historyData.find(function(g){ return g.date === date; });
    if (!group) return;
    var item = group.items[originalIdx];
    if (!item) return;

    if (!item.read) {
      item.read = true;
      el.classList.add('read');
    }

    // 与「今日更新」抽屉一致：跳回知识库页面并定位到对应知识条目
    var url = 'demo-ark-knowledge.html?jumpTitle=' + encodeURIComponent(item.title) + '&jumpPath=' + encodeURIComponent(item.path);
    window.location.href = url;
  }

  function applyFilter() {
    var from = document.getElementById('dateFrom').value;
    var to = document.getElementById('dateTo').value;
    var typeVal = document.getElementById('typeFilter').value;
    var readVal = document.getElementById('readFilter').value;
    renderHistory(from, to, typeVal, readVal);
  }

  function resetFilter() {
    document.getElementById('dateFrom').value = TODAY;
    document.getElementById('dateTo').value = TODAY;
    document.getElementById('typeFilter').value = 'all';
    document.getElementById('readFilter').value = 'all';
    renderHistory(TODAY, TODAY, 'all', 'all');
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('dateFrom').value = TODAY;
    document.getElementById('dateTo').value = TODAY;
    renderHistory(TODAY, TODAY, 'all', 'all');
  });
</script>
</body>
</html>
